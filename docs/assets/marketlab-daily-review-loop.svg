<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><rect width="1200" height="330" rx="24" fill="#f3f6fa"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#142d4e"><text x="50" y="60" font-size="26" font-weight="700">마켓랩 · 하루의 결과를 다음 관찰로 연결하기</text><text x="50" y="95" font-size="16">모의 체결 원장 → 마감 복기 → 실제 적용 이력 → 적용 이후 관측</text></g><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" text-anchor="middle"><rect x="40" y="135" width="245" height="100" rx="15" fill="#153c60"/><text x="162" y="177" fill="white">왜 거래했나</text><text x="162" y="207" fill="#dceaf3" font-size="15">당시 판단 · 체결 · 비용</text><rect x="330" y="135" width="245" height="100" rx="15" fill="#17646c"/><text x="452" y="177" fill="white">무엇을 발견했나</text><text x="452" y="207" fill="#dceaf3" font-size="15">종목별 종합 복기 · 한계</text><rect x="620" y="135" width="245" height="100" rx="15" fill="#17646c"/><text x="742" y="177" fill="white">어떻게 수정했나</text><text x="742" y="207" fill="#dceaf3" font-size="15">유지 · 예약 · 실제 적용 구분</text><rect x="910" y="135" width="245" height="100" rx="15" fill="#153c60"/><text x="1032" y="177" fill="white">그 뒤 결과는</text><text x="1032" y="207" fill="#dceaf3" font-size="15">표본 · 관측 기간 · 비용 비교</text></g><g stroke="#7e95aa" stroke-width="3" fill="none"><path d="M292 185h25m-10-8 10 8-10 8M582 185h25m-10-8 10 8-10 8M872 185h25m-10-8 10 8-10 8"/></g><text x="50" y="285" font-family="Malgun Gothic,sans-serif" fill="#455c72" font-size="17">관측된 손익과 수정의 효과는 구분합니다. 결과가 아직 없으면 다음 거래일부터 추적합니다.</text></svg>
