<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<rect width="1280" height="760" fill="#f5f4ef"/>
<rect x="40" y="38" width="1200" height="684" rx="22" fill="#ffffff"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif">
<text x="76" y="91" font-size="20" font-weight="700" fill="#18746d">MARKET LAB / 03</text>
<text x="76" y="145" font-size="35" font-weight="700" fill="#17304a">체결과 검증의 경계를 다시 세우다</text>
<text x="76" y="182" font-size="18" fill="#586d7f">2026.11.27 · 구현된 모의매매와 과거 자료 연구의 흐름</text>
<text x="76" y="236" font-size="18" font-weight="700" fill="#17304a">운영 · 관측한 자료로 체결하고, 원장을 보존하며 복기한다</text>
<rect x="76" y="258" width="340" height="126" rx="14" fill="#173b5a"/>
<rect x="470" y="258" width="340" height="126" rx="14" fill="#173b5a"/>
<rect x="864" y="258" width="340" height="126" rx="14" fill="#173b5a"/>
<text x="246" y="301" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">시세·호가 관측</text>
<text x="246" y="340" text-anchor="middle" font-size="17" fill="#dbe7ed">5초 감시 · 공통 API 대기열</text>
<text x="640" y="301" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">모의 주문·체결</text>
<text x="640" y="340" text-anchor="middle" font-size="17" fill="#dbe7ed">잔량 재평가 · 주문별 체결 묶기</text>
<text x="1034" y="301" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">종목별 복기</text>
<text x="1034" y="340" text-anchor="middle" font-size="17" fill="#dbe7ed">당시 판단 · 마감 후 분봉 비교</text>
<line x1="425" y1="321" x2="457" y2="321" stroke="#7a929e" stroke-width="3"/><polygon points="457,321 446,314 446,328" fill="#7a929e"/>
<line x1="819" y1="321" x2="851" y2="321" stroke="#7a929e" stroke-width="3"/><polygon points="851,321 840,314 840,328" fill="#7a929e"/>
<text x="76" y="440" font-size="18" font-weight="700" fill="#18746d">연구 · 당시 알 수 있었던 자료만 사용해 독립 원장에서 비교한다</text>
<rect x="76" y="462" width="340" height="126" rx="14" fill="#e7f2ee"/>
<rect x="470" y="462" width="340" height="126" rx="14" fill="#e7f2ee"/>
<rect x="864" y="462" width="340" height="126" rx="14" fill="#e7f2ee"/>
<text x="246" y="505" text-anchor="middle" font-size="24" font-weight="700" fill="#185d58">과거 분봉·뉴스·공시</text>
<text x="246" y="544" text-anchor="middle" font-size="17" fill="#456963">출처 보존 · 중단 후 이어받기</text>
<text x="640" y="505" text-anchor="middle" font-size="24" font-weight="700" fill="#185d58">시각·누락 검사</text>
<text x="640" y="544" text-anchor="middle" font-size="17" fill="#456963">발표·가용·수정 시각 구분</text>
<text x="1034" y="505" text-anchor="middle" font-size="24" font-weight="700" fill="#185d58">독립 재현·후보 비교</text>
<text x="1034" y="544" text-anchor="middle" font-size="17" fill="#456963">입력 자료가 부족하면 중단</text>
<line x1="425" y1="525" x2="457" y2="525" stroke="#7a929e" stroke-width="3"/><polygon points="457,525 446,518 446,532" fill="#7a929e"/>
<line x1="819" y1="525" x2="851" y2="525" stroke="#7a929e" stroke-width="3"/><polygon points="851,525 840,518 840,532" fill="#7a929e"/>
<rect x="76" y="618" width="1128" height="55" rx="10" fill="#fff4dc"/>
<text x="640" y="652" text-anchor="middle" font-size="18" fill="#79561e">연구 결과의 운영 자동 적용 없음 · 별도 검토와 신규 모의 검증 필요</text>
<text x="76" y="701" font-size="15" fill="#75838c">구현 설명용 도식 · 실제 계좌, 거래 기록, 시세, 성과 그래프를 포함하지 않음</text>
</g></svg>
