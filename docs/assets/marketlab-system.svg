<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">Market Lab architecture</title><desc id="desc">Market data flows through a shared request queue into per-user paper orders and ledgers. Daily review and pattern comparison use recorded evidence. Live trading is disconnected.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#18385c"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#72d6cc"/></marker></defs>
<rect width="1280" height="660" rx="24" fill="url(#bg)"/>
<g font-family="Segoe UI,Malgun Gothic,sans-serif"><text x="64" y="70" fill="#72d6cc" font-size="17" letter-spacing="4">MARKET LAB / ENGINEERING NOTES</text><text x="64" y="121" fill="#fff" font-size="36" font-weight="700">시세 · 주문 · 체결 · 복기를 구분하다</text><text x="64" y="158" fill="#bbccde" font-size="18">Node.js · SQLite · KR / US paper trading · single-process host</text>
<g fill="#203c5d" stroke="#45617e"><rect x="64" y="210" width="320" height="140" rx="16"/><rect x="480" y="210" width="320" height="140" rx="16"/><rect x="896" y="210" width="320" height="140" rx="16"/><rect x="480" y="424" width="320" height="140" rx="16"/><rect x="896" y="424" width="320" height="140" rx="16"/></g>
<g fill="#fff" font-size="22" font-weight="600"><text x="88" y="247">외부 데이터</text><text x="504" y="247">공통 전송 경로</text><text x="920" y="247">사용자별 모의계좌</text><text x="504" y="461">보존된 관측 근거</text><text x="920" y="461">복기 · 가상 비교</text></g>
<g fill="#c3d2e2" font-size="17"><text x="88" y="283">시세 · 호가 · 시장 일정</text><text x="88" y="316">뉴스 · 공시 / 정보원별 상태</text><text x="504" y="283">그룹 대기열 · 캐시 · 요청 공유</text><text x="504" y="316">한도 헤더 · 제한된 GET 재시도</text><text x="920" y="283">서버 세션 → 개인 DB</text><text x="920" y="316">주문 → 호가 확인 → 부분 체결</text><text x="504" y="497">가격 시각 · 수신 시각 · 전략 버전</text><text x="504" y="530">당시 정보와 사후 정보 구분</text><text x="920" y="497">현지 거래일 보고서 · 손익 달력</text><text x="920" y="530">차트패턴 비교는 주문과 분리</text></g>
<g fill="none" stroke="#72d6cc" stroke-width="2.5" marker-end="url(#arrow)"><path d="M384 280H464"/><path d="M800 280H880"/><path d="M1056 350V386H640V408"/><path d="M800 494H880"/></g>
<text x="64" y="608" fill="#93aec9" font-size="16">모의매매 전용 · 실제 주문 전송 경로 비활성 · 관측하지 않은 체결은 생성하지 않음</text></g></svg>
