<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마켓랩 | 로그인</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/auth.css"><script type="module" src="/auth.js"></script></head>
<body><main class="auth-shell"><a class="auth-brand" href="/">마켓랩 <small>Market Lab</small></a><section class="card auth-card"><h1 id="auth-title">내 계좌로 로그인</h1><p id="auth-description">나의 모의계좌, 거래내역, API 연결을 안전하게 관리하세요.</p><p class="auth-hint">마켓랩 전용 계정입니다. 토스 로그인 비밀번호를 입력하지 마세요.</p><form id="login-form"><label>아이디<input name="username" autocomplete="username" pattern="[a-z0-9_-]{3,40}" minlength="3" maxlength="40" required placeholder="영문 소문자·숫자, 3~40자"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><button class="button primary" id="auth-submit">로그인</button></form><p id="auth-message" role="status" aria-live="polite"></p><p class="auth-hint" id="invite-hint">새 사용자는 소유자가 발급한 초대 링크로 가입할 수 있습니다.</p></section><p class="auth-hint">개인별 국내·미국장 모의계좌 · 실거래 비활성</p></main></body></html>
