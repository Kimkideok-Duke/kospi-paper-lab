<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마켓랩 | 내 계정</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/auth.css"><script type="module" src="/auth.js"></script></head><body><main class="auth-shell"><a class="auth-brand" href="/">← 마켓랩 대시보드</a><section class="card auth-card"><h1>내 계정</h1><p id="account-name"></p><p class="auth-hint">로그인한 계정의 API 연결과 모의계좌만 표시됩니다. 토스 API는 대시보드의 설정에서 연결하세요.</p><button class="button secondary" id="logout">로그아웃</button></section><section class="card auth-card"><h2>비밀번호 변경</h2><form id="password-form"><label>현재 비밀번호<input name="currentPassword" type="password" autocomplete="current-password" maxlength="128" required></label><label>새 비밀번호<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="button primary">비밀번호 변경</button></form><p class="auth-hint">변경하면 다른 기기의 로그인은 모두 해제됩니다.</p></section><section class="card auth-card" id="owner-tools" hidden><h2>사용자 초대</h2><p>24시간 동안 한 번 사용할 수 있는 가입 링크를 만듭니다. 새 사용자는 별도 모의계좌와 API 연결을 갖습니다.</p><button class="button primary" id="create-invite">초대 링크 만들기</button><label id="invite-result" hidden>공유할 초대 링크<input id="invite-url" readonly></label><button class="button secondary" id="copy-invite" hidden>링크 복사</button></section><p id="auth-message" role="status" aria-live="polite"></p></main></body></html>
